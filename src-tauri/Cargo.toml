[package]
name = "foldale"
version = "2.0.0"
description = "Foldale, a dual-pane file manager for macOS"
authors = ["Mehmet Akif Cifci"]
license = "MIT"
repository = "https://github.com/themanoftalent/foldale"
edition = "2021"
rust-version = "1.77"

[lib]
name = "foldale_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
trash = "5.2"
zip = { version = "2.2", default-features = false, features = ["deflate", "time"] }
flate2 = "1.0"
tar = "0.4"
sysinfo = "0.32"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1.11"
dirs = "5.0"
open = "5.3"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread"] }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSFileManager", "NSURL", "NSError", "NSString"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
