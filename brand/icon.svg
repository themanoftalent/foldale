<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262F5E"/>
      <stop offset="1" stop-color="#0C1024"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#6E7BFF" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#6E7BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A44C2"/>
      <stop offset="1" stop-color="#262D8A"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#8C96FF"/>
      <stop offset="1" stop-color="#5560F2"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#5FF0C6"/>
      <stop offset="1" stop-color="#17B488"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="pshadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#05081A" flood-opacity="0.45"/>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185" ry="185"/></clipPath>
  </defs>

  <!-- squircle tile -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)" opacity="0.30"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" ry="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>

  <!-- folder back with tab -->
  <path d="M248 318 Q248 282 284 282 L420 282 Q444 282 460 300 L486 330 L740 330 Q776 330 776 366 L776 700 L248 700 Z" fill="url(#back)"/>

  <!-- front left pane (folded flap) -->
  <g filter="url(#pshadow)">
    <path d="M236 420 Q232 392 260 392 L478 392 Q494 392 494 408 L494 722 Q494 740 476 740 L278 740 Q248 740 246 710 Z" fill="url(#left)"/>
    <path d="M546 392 L764 392 Q792 392 788 420 L778 710 Q776 740 746 740 L548 740 Q530 740 530 722 L530 408 Q530 392 546 392 Z" fill="url(#right)"/>
  </g>
  <!-- fold crease highlights -->
  <path d="M260 392 L478 392 Q494 392 494 408 L494 410 L244 410 Q246 392 260 392 Z" fill="#FFFFFF" fill-opacity="0.26"/>
  <path d="M546 392 L764 392 Q782 392 786 410 L530 410 L530 408 Q530 392 546 392 Z" fill="#FFFFFF" fill-opacity="0.28"/>
  <!-- pane rows -->
  <g fill="#FFFFFF">
    <rect x="292" y="470" width="150" height="22" rx="11" fill-opacity="0.85"/>
    <rect x="292" y="522" width="112" height="22" rx="11" fill-opacity="0.55"/>
    <rect x="292" y="574" width="134" height="22" rx="11" fill-opacity="0.55"/>
    <rect x="578" y="470" width="120" height="22" rx="11" fill-opacity="0.55"/>
    <rect x="578" y="522" width="150" height="22" rx="11" fill-opacity="0.85"/>
    <rect x="578" y="574" width="100" height="22" rx="11" fill-opacity="0.55"/>
  </g>
</svg>
